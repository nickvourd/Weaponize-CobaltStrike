<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#0a0e27"/>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#e74c3c" stroke-width="2"/>

  <!-- Strike effect - diagonal lines -->
  <g stroke="#3498db" stroke-width="2" opacity="0.8">
    <line x1="50" y1="50" x2="150" y2="150"/>
    <line x1="60" y1="40" x2="160" y2="140"/>
    <line x1="40" y1="60" x2="140" y2="160"/>
  </g>

  <!-- Central shield shape -->
  <path d="M 100 60 L 140 80 L 140 120 Q 100 150 100 150 Q 100 150 60 120 L 60 80 Z"
        fill="none" stroke="#e74c3c" stroke-width="2.5"/>

  <!-- Center circle -->
  <circle cx="100" cy="100" r="15" fill="#3498db" opacity="0.7"/>

  <!-- Inner decorative rings -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#2ecc71" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#f39c12" stroke-width="1" opacity="0.5"/>

  <!-- Top accent -->
  <path d="M 85 45 Q 100 35 115 45" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom accent -->
  <path d="M 85 155 Q 100 165 115 155" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>

  <!-- Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        fill="#e74c3c" text-anchor="middle" letter-spacing="2">WEAPONIZE</text>
</svg>